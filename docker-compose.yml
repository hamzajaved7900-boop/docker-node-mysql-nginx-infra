version: '3.8'

services:
  db:
    image: mysql:8.0-debian
    container_name: production_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKERHUB_USERNAME}/node-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: production_backend
    restart: always
    environment:
      PORT: ${APP_PORT}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${DOCKERHUB_USERNAME}/nginx-proxy:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: production_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal_network:
    driver: bridge

volumes:
  db_data:
    driver: local